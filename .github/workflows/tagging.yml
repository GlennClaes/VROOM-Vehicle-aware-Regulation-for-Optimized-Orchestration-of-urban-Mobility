name: Bump version & Tag

on:
  push:
    branches:
      - main

permissions:
  contents: write


jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: '0'

    - name: Bump version and push tag
      id: tag_action
      uses: anothrNick/github-tag-action@1.67.0
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        WITH_V: true
        DEFAULT_BUMP: patch

        
    - name: Create Release
      uses: softprops/action-gh-release@v2
      if: steps.tag_action.outputs.new_tag != ''
      with:
        tag_name: ${{ steps.tag_action.outputs.new_tag }}
        generate_release_notes: true
        name: Release ${{ steps.tag_action.outputs.new_tag }}
        body: |
          Automatic release generated by the CI/CD pipeline.
          Version: ${{ steps.tag_action.outputs.new_tag }}
        draft: false
        prerelease: false
        fail_on_unmatched_files: false
        files: |
          backend/rl/models/dqn_universal_best.pt
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


