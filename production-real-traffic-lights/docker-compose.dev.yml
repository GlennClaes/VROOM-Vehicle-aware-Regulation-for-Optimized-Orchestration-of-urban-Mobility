services:
  nats:
    image: nats:2.10-alpine
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  intersection-dev:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    image: vroom-real-traffic-controller:dev
    command: ["--once"]
    env_file:
      - .env.example
    environment:
      VROOM_INTERSECTION_ID: hasselt-xl-dev
      VROOM_HARDWARE_ADAPTER: mock
    depends_on:
      nats:
        condition: service_healthy
