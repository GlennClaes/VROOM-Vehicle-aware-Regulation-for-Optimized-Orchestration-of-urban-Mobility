name: "PR Description Helper"

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  update-description:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get list of changed files
        id: file_list
        run: |
          # Fetch the list of changed files relative to the base branch
          FILES=$(git diff --name-only origin/${{ github.base_ref }}...origin/${{ github.head_ref }} | sed 's/^/- `/;s/$/`/')
          
          # Format the list for GitHub outputs
          echo "FILES_LIST<<EOF" >> $GITHUB_OUTPUT
          echo "$FILES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Update PR Description with Files
        uses: actions/github-script@v7
        env:
          FILES_LIST: ${{ steps.file_list.outputs.FILES_LIST }}
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            
            const rawFiles = process.env.FILES_LIST.split('\n').filter(f => f.trim() !== '');
            const groups = {};
            
            rawFiles.forEach(line => {
              // Extract path from "- `path`"
              const path = line.replace(/^- `/, '').replace(/`$/, '');
              const parts = path.split('/');
              const groupName = parts.length > 1 ? parts[0] : 'Root';
              if (!groups[groupName]) groups[groupName] = [];
              groups[groupName].push(path);
            });
            
            let formattedFiles = '<details><summary><b>🔍 View detailed file changes</b></summary>\n\n';
            for (const [group, paths] of Object.entries(groups)) {
              const icon = group === 'backend' ? '🤖' : group === 'frontend' ? '🖥️' : group === '.github' ? '⚙️' : group === 'scripts' ? '📜' : '📁';
              formattedFiles += `**${icon} ${group.toUpperCase()}**\n`;
              paths.forEach(p => {
                formattedFiles += `- \`${p}\`\n`;
              });
              formattedFiles += '\n';
            }
            formattedFiles += '</details>';
            
            let body = pr.body || '';
            const startMarker = '<!-- FILES_START -->';
            const endMarker = '<!-- FILES_END -->';
            
            if (body.includes(startMarker) && body.includes(endMarker)) {
              const before = body.split(startMarker)[0];
              const after = body.split(endMarker)[1];
              body = before + startMarker + '\n' + formattedFiles + '\n' + endMarker + after;
            } else {
              const automationSection = `\n\n--- \n### 📊 Automated Reporting\n#### 📂 Changed Files\n${startMarker}\n${formattedFiles}\n${endMarker}`;
              body += automationSection;
            }
            
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              body: body
            });

