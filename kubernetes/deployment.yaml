apiVersion: apps/v1
kind: Deployment
metadata:
  name: vroom-redis
  labels:
    app: vroom-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vroom-redis
  template:
    metadata:
      labels:
        app: vroom-redis
    spec:
      containers:
      - name: redis
        image: redis:alpine
        ports:
        - containerPort: 6379
        resources:
          limits:
            cpu: "250m"
            memory: "256Mi"
          requests:
            cpu: "100m"
            memory: "128Mi"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vroom-backend
  labels:
    app: vroom-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: vroom-backend
  template:
    metadata:
      labels:
        app: vroom-backend
    spec:
      containers:
      - name: backend
        image: vroom-backend:latest
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: database-url
        - name: REDIS_HOST
          value: "vroom-redis-service"
        - name: REDIS_PORT
          value: "6379"
        ports:
        - containerPort: 8000
        resources:
          limits:
            cpu: "1"
            memory: "1Gi"
          requests:
            cpu: "500m"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vroom-sumo-web3d
  labels:
    app: vroom-sumo-web3d
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vroom-sumo-web3d
  template:
    metadata:
      labels:
        app: vroom-sumo-web3d
    spec:
      containers:
      - name: sumo-web3d
        image: vroom-sumo-web3d:latest
        env:
        - name: REDIS_HOST
          value: "vroom-redis-service"
        - name: REDIS_PORT
          value: "6379"
        - name: ENV
          value: "production"
        ports:
        - containerPort: 5000
        - containerPort: 5678
        resources:
          limits:
            cpu: "1.5"
            memory: "1.5Gi"
          requests:
            cpu: "500m"
            memory: "512Mi"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vroom-frontend
  labels:
    app: vroom-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vroom-frontend
  template:
    metadata:
      labels:
        app: vroom-frontend
    spec:
      containers:
      - name: frontend
        image: vroom-frontend:latest
        ports:
        - containerPort: 80
        resources:
          limits:
            cpu: "250m"
            memory: "256Mi"
          requests:
            cpu: "100m"
            memory: "128Mi"
