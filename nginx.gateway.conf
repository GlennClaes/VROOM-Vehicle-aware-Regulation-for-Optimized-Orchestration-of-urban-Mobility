server {
    listen 80;
    server_name localhost;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # Backend API
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Simulator Frontend & Assets
    location = /map {
        return 301 /map/;
    }

    location /map/ {
        rewrite ^/map/(.*) /$1 break;
        proxy_pass http://sumo-web3d:5000;
        proxy_redirect / /map/;
        proxy_set_header Host $host;
    }

    # Simulator WebSocket
    location /ws-simulator/ {
        rewrite ^/ws-simulator/(.*) /$1 break;
        proxy_pass http://sumo-web3d:5678;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        # Production uses port 80. Resolver prevents crash if frontend is slow to start.
        resolver 127.0.0.11 valid=30s;
        set $upstream_frontend frontend;
        proxy_pass http://$upstream_frontend:80;
        proxy_set_header Host $host;

        # Fallback to port 5173 for development
        error_page 502 504 = @development;
    }

    location @development {
        resolver 127.0.0.11 valid=30s;
        set $upstream_frontend frontend;
        proxy_pass http://$upstream_frontend:5173;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
    }

    error_page 500 503 /50x.html;
}
