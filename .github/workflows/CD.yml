name: Continuous Deployment

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ secrets.DOCKER_USERNAME }}/vroom-backend
            ${{ secrets.DOCKER_USERNAME }}/vroom-frontend
            ${{ secrets.DOCKER_USERNAME }}/vroom-sumo-web3d
            ${{ secrets.DOCKER_USERNAME }}/vroom-training

      # 1. Backend Service
      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile.prod
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/vroom-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/vroom-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 2. Training Image (New)
      - name: Build and push Training
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile.train
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/vroom-training:latest
            ${{ secrets.DOCKER_USERNAME }}/vroom-training:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 3. Frontend (Prod optimized)
      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/vroom-frontend:latest
            ${{ secrets.DOCKER_USERNAME }}/vroom-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 4. Sumo-Web3D
      - name: Build and push Sumo-Web3D
        uses: docker/build-push-action@v5
        with:
          context: ./sumo-web3d
          file: ./sumo-web3d/Dockerfile.prod
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/vroom-sumo-web3d:latest
            ${{ secrets.DOCKER_USERNAME }}/vroom-sumo-web3d:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  update-badges:
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download coverage from CI workflow
        run: |
          CI_RUN_ID=$(gh run list --workflow="Continuous Integration" --branch=main --status=success --limit=1 --json databaseId --jq '.[0].databaseId')
          echo "Latest successful CI Run ID: $CI_RUN_ID"
          
          # Download artifacts (remove existing files first to prevent extraction conflicts)
          rm -f backend/coverage.json
          gh run download $CI_RUN_ID --name backend-coverage --dir backend/
          rm -f frontend/coverage/coverage-summary.json
          gh run download $CI_RUN_ID --name frontend-coverage --dir frontend/coverage/

      - name: Set up Node.js and Python
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Update badges
        run: |
          # 1. Coverage
          BE_COV=$(python3 -c "import json; print(round(json.load(open('backend/coverage.json'))['totals']['percent_covered']))")
          FE_COV=$(node -e "const fs = require('fs'); const summary = JSON.parse(fs.readFileSync('frontend/coverage/coverage-summary.json', 'utf8')); console.log(Math.round(summary.total.lines.pct));")
          
          echo "Coverage: Backend: $BE_COV%, Frontend: $FE_COV%"
          sed -i -E "s/Backend_Coverage-[0-9]+%/Backend_Coverage-${BE_COV}%/g" README.md
          sed -i -E "s/Frontend_Coverage-[0-9]+%/Frontend_Coverage-${FE_COV}%/g" README.md
          
          # 2. Version
          LATEST_TAG=$(git describe --tags --abbrev=0 || echo "v0.0.1")
          echo "Updating version badge to $LATEST_TAG"
          sed -i -E "s/version-v[0-9]+\.[0-9]+\.[0-9]+-brightgreen/version-${LATEST_TAG}-brightgreen/g" README.md

          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add README.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "docs: update badges [skip ci]" && git push origin main)

